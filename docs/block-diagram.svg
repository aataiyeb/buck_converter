<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Synchronous buck converter with PI feedback</title>
<desc>The Nucleo sends PWM from D7 and an enable signal from D8 to the IR2104. The IR2104 drives Q1 from pin 7 and Q2 from pin 5. The switching node feeds the inductor and output capacitor, a voltage divider scales the output down, and it returns to the Nucleo's A0 input, closing the loop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="340" fill="#FFFFFF"/>
<text x="20" y="22" font-size="14" font-weight="bold" fill="#2C2C2A">12 V to 5 V synchronous buck converter with PI feedback</text>

<rect x="20" y="40" width="150" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="95" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Nucleo-G474RE</text>
<text x="95" y="84" text-anchor="middle" font-size="12" fill="#185FA5">PI controller + PWM</text>

<rect x="265" y="40" width="150" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">IR2104</text>
<text x="340" y="84" text-anchor="middle" font-size="12" fill="#5F5E5A">gate driver</text>

<rect x="510" y="40" width="150" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="585" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#633806">Q1 + Q2</text>
<text x="585" y="84" text-anchor="middle" font-size="12" fill="#854F0B">switch the 12 V</text>

<rect x="510" y="240" width="150" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="585" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">L1 + 220 µF</text>
<text x="585" y="284" text-anchor="middle" font-size="12" fill="#0F6E56">smooth to DC (OUT)</text>

<rect x="265" y="240" width="150" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Divider</text>
<text x="340" y="284" text-anchor="middle" font-size="12" fill="#0F6E56">10k + 5.1k, 100 nF</text>

<line x1="170" y1="62" x2="263" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="217" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">D7 to pin 2</text>
<line x1="170" y1="90" x2="263" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="217" y="80" text-anchor="middle" font-size="12" fill="#5F5E5A">D8 to pin 3</text>

<line x1="415" y1="62" x2="508" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="462" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">pin 7 to Q1</text>
<line x1="415" y1="90" x2="508" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="462" y="80" text-anchor="middle" font-size="12" fill="#5F5E5A">pin 5 to Q2</text>

<line x1="585" y1="104" x2="585" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="595" y="170" font-size="12" fill="#5F5E5A">SW node</text>

<line x1="510" y1="272" x2="417" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="462" y="262" text-anchor="middle" font-size="12" fill="#5F5E5A">OUT</text>

<polyline points="265,272 95,272 95,106" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="262" text-anchor="middle" font-size="12" fill="#5F5E5A">A0 (a third of OUT)</text>

<text x="340" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">12 V from the bench supply feeds IR2104 pin 1 and Q1's drain</text>
<text x="340" y="190" text-anchor="middle" font-size="12" fill="#5F5E5A">the PI controller reads A0 every 1 ms and adjusts the PWM duty</text>
<text x="340" y="210" text-anchor="middle" font-size="12" fill="#5F5E5A">OUT = 5 V into a 10 ohm load</text>
</svg>
